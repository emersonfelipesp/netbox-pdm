[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netbox_pdm*"]

[project]
name = "netbox-pdm"
version = "0.0.1.post1"
description = "NetBox plugin for Proxmox Datacenter Manager (PDM) inventory through proxbox-api"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Emerson Felipe", email = "emersonfelipe.2003@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "netbox-proxbox>=0.0.18,<0.1.0",
    "requests>=2.33.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "ghp-import>=2.1",
]
screenshot = [
    "playwright>=1.58.0",
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://github.com/emersonfelipesp/netbox-pdm"
Documentation = "https://emersonfelipesp.github.io/netbox-pdm/"
Source = "https://github.com/emersonfelipesp/netbox-pdm"
Issues = "https://github.com/emersonfelipesp/netbox-pdm/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["netbox_pdm"]
omit = [
    "**/__pycache__/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "C90"]
ignore = ["F401", "F403", "E501"]
