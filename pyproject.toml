[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netbox_pdm*"]

[project]
name = "netbox-pdm"
version = "0.0.2"
description = "NetBox plugin for Proxmox Datacenter Manager (PDM) inventory via proxmox-sdk"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Emerson Felipe", email = "emersonfelipe.2003@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # compat.py imports packaging at module scope to compare NetBox release
    # strings. Inside a NetBox install it is transitively guaranteed (NetBox
    # core uses it on the same PluginConfig.validate path), but this package
    # imports it directly, so it belongs in the metadata rather than being
    # inherited by luck.
    "packaging>=23.0",
    "PyYAML>=6.0",
    "proxmox-sdk>=0.0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "ghp-import>=2.1",
]
screenshot = [
    "playwright>=1.58.0",
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://github.com/emersonfelipesp/netbox-pdm"
Documentation = "https://emersonfelipesp.github.io/netbox-pdm/"
Source = "https://github.com/emersonfelipesp/netbox-pdm"
Issues = "https://github.com/emersonfelipesp/netbox-pdm/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["netbox_pdm"]
omit = [
    "**/__pycache__/*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "C90"]
ignore = ["F401", "F403", "E501"]

[tool.ruff.format]
# `netbox_pdm/compat.py` is vendored byte-identically across every Proxbox-family
# NetBox plugin, and those repositories use different `line-length` settings
# (88 here upstream, 100 and 120 elsewhere). Letting each repo reformat it would
# silently break the byte-identity that the cross-repo drift check depends on —
# and that check is the only thing keeping five copies of a compatibility policy
# in agreement. The file is formatted once, at the narrowest width, in
# netbox-proxbox; every other copy takes it verbatim.
exclude = ["netbox_pdm/compat.py"]
