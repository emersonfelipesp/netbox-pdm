name: e2e

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-docker:
    name: NetBox plugin install + smoke / ${{ matrix.netbox_image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        netbox_image:
          - netboxcommunity/netbox:v4.7.0-5.1.0@sha256:73a54ff279461170032b59a57a1930929965e3ba15c195af59f4b5f6d39a84a9
    env:
      NETBOX_IMAGE: ${{ matrix.netbox_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/

      - name: Smoke-install plugin into NetBox image
        run: |
          set -eux
          docker pull "$NETBOX_IMAGE"
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            "$NETBOX_IMAGE" \
            sh -c '
              uv pip install --python /opt/netbox/venv/bin/python --no-deps /dist/*.whl &&
              /opt/netbox/venv/bin/python -c "import netbox_pdm; print(netbox_pdm.__name__)"
            '


  netbox-ga-compatibility:
    name: NetBox source compatibility / ${{ matrix.netbox_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - netbox_version: v4.5.8
            netbox_ref: 75e1b86613792458b4d4c8d0cbbfc94df16cfaaf
          - netbox_version: v4.6.6
            netbox_ref: fb8c455ba61b57119a70670612dfdd05e8438b10
          - netbox_version: v4.7.0
            netbox_ref: 5f06007e4c9bacc93ce17c1e645fc1143d60df3d
    services:
      postgres:
        image: postgres:16-alpine@sha256:075f7ba66bc9b3ce7d6b8b635208ff61cd7cf1a67d71ec530eec5d7ae0cbe571
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout plugin
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout exact NetBox source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox_ref }}
          path: netbox-source
          persist-credentials: false

      - name: Checkout the 4.7-capable Proxbox contract
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: emersonfelipesp/netbox-proxbox
          ref: 2ad98bd703f4ed06636b446ec7fc67749e4d69c9
          path: netbox-proxbox
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact test stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r netbox-source/requirements.txt
          python -m pip install -e ./netbox-proxbox
          python -m pip install -e ".[test]" --no-deps
          python -m pip install "proxmox-sdk==0.0.12" "pytest==9.0.3" "pytest-django==4.12.0"

      - name: Assert immutable NetBox checkout
        run: test "$(git -C netbox-source rev-parse HEAD)" = "${{ matrix.netbox_ref }}"

      - name: Migrate, check, and render registered views
        env:
          NETBOX_CONFIGURATION: tests.netbox_test_configuration
          DJANGO_SETTINGS_MODULE: netbox.settings
          NETBOX_PDM_REQUIRE_DJANGO: "1"
          PYTHONPATH: ${{ github.workspace }}/netbox-source/netbox:${{ github.workspace }}/netbox-proxbox:${{ github.workspace }}
        run: |
          python netbox-source/netbox/manage.py check
          python netbox-source/netbox/manage.py migrate --no-input
          python netbox-source/netbox/manage.py makemigrations netbox_pdm --check --dry-run
          pytest tests/test_netbox_compat_django.py \
            tests/test_list_view_render_django.py \
            --reuse-db --create-db
